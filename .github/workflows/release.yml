name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable release tag to rebuild and publish
        required: false
        type: string

concurrency:
  group: release-main
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    name: Prepare or create release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      publish_requested: ${{ steps.release.outputs.release_created == 'true' || inputs.tag != '' }}
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name || inputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Create or update the release pull request
        if: inputs.tag == ''
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN || github.token }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    name: Verify and build distributions
    needs: release-please
    if: needs.release-please.outputs.publish_requested == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.release-please.outputs.tag_name }}
      - name: Install the pinned vx toolchain
        uses: loonghao/vx@61a604b0dc206c691c33db8e8f9c420ca47c3914 # vx-v0.9.30
        with:
          version: "0.9.30"
          github-token: ${{ github.token }}
          tools: "uv just rust dotnet"
          cache: "true"
      - name: Install the pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Verify, test, and build the immutable tag
        run: vx just release-check "${{ needs.release-please.outputs.tag_name }}"
      - name: Resolve the immutable package version
        id: package-version
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Pack the C# provider contract
        run: >-
          vx dotnet pack
          sdk/csharp/GameLearningRuntime.Provider/GameLearningRuntime.Provider.csproj
          --configuration Release
          --output dist-sdk
          -p:PackageVersion=${{ steps.package-version.outputs.version }}
      - name: Upload Python distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Upload the C# provider SDK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: csharp-provider-sdk
          path: dist-sdk/
          if-no-files-found: error
          retention-days: 7

  glr-binaries:
    name: Build GLR distribution / ${{ matrix.target }}
    needs: release-please
    if: needs.release-please.outputs.publish_requested == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cli_binary: target/x86_64-unknown-linux-gnu/release/glr
            host_binary: target/x86_64-unknown-linux-gnu/release/glr-hostd
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            cli_binary: target/x86_64-pc-windows-msvc/release/glr.exe
            host_binary: target/x86_64-pc-windows-msvc/release/glr-hostd.exe
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            cli_binary: target/x86_64-apple-darwin/release/glr
            host_binary: target/x86_64-apple-darwin/release/glr-hostd
          - runner: macos-15
            target: aarch64-apple-darwin
            cli_binary: target/aarch64-apple-darwin/release/glr
            host_binary: target/aarch64-apple-darwin/release/glr-hostd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release-please.outputs.tag_name }}
      - name: Install the pinned vx toolchain
        uses: loonghao/vx@61a604b0dc206c691c33db8e8f9c420ca47c3914 # vx-v0.9.30
        with:
          version: "0.9.30"
          github-token: ${{ github.token }}
          tools: "uv just rust dotnet"
          cache: "true"
      - name: Resolve the immutable package version
        id: package-version
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Build the standalone CLI and native Runtime Host
        run: >-
          vx cargo build --package glr-cli --bin glr
          --package glr-host --bin glr-hostd
          --release --locked --target "${{ matrix.target }}"
      - name: Package the unified GLR distribution
        run: >-
          vx python scripts/package_cli.py
          --cli "${{ matrix.cli_binary }}"
          --host "${{ matrix.host_binary }}"
          --target "${{ matrix.target }}"
          --version "${{ steps.package-version.outputs.version }}"
      - name: Upload the GLR distribution archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: glr-${{ matrix.target }}
          path: .glr-release/*.zip
          if-no-files-found: error
          retention-days: 7

  github-release:
    name: Attach GitHub Release assets
    needs: [release-please, build, glr-binaries]
    if: needs.release-please.outputs.publish_requested == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: release-assets/
      - name: Download the C# provider SDK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: csharp-provider-sdk
          path: release-assets/
      - name: Download standalone GLR distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: glr-*
          path: release-assets/
          merge-multiple: true
      - name: Attest release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "release-assets/*"
      - name: Write deterministic checksums
        working-directory: release-assets
        run: sha256sum ./* > SHA256SUMS
      - name: Attach assets to the immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: >-
          gh release upload "$RELEASE_TAG" release-assets/*
          --clobber --repo "${{ github.repository }}"

  pypi-publish:
    name: Publish distributions to PyPI
    needs: [release-please, build, github-release]
    if: needs.release-please.outputs.publish_requested == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/game-learning-runtime
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist/
      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
