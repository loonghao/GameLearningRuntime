name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    uses: ./.github/workflows/reusable-python-ci.yml
    with:
      python-versions: '["3.10", "3.11", "3.12", "3.13"]'
      sync-args: "--frozen --all-groups"
      lint-command: "uv run ruff check . && uv run ruff format --check . && uv run mypy"
      test-command: 'uv run pytest -m "not torchrl" --cov=game_learning_runtime --cov-report=term-missing'

  torchrl:
    name: TorchRL 0.13 contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.19"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --all-groups --extra torchrl
      - run: >-
          uv run --extra torchrl mypy
          src/game_learning_runtime/integrations/torch_objectives.py
          src/game_learning_runtime/integrations/torchrl.py
      - run: >-
          uv run --extra torchrl pytest
          tests_optional/test_torch_objectives.py
          tests_optional/test_torchrl.py

  gymnasium:
    name: Gymnasium 1.x contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.19"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --all-groups --extra gymnasium
      - run: uv run --extra gymnasium mypy src/game_learning_runtime/integrations/gymnasium.py
      - run: uv run --extra gymnasium pytest tests_optional/test_gymnasium.py

  package:
    name: Build distribution
    needs: [core, gymnasium, torchrl]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.19"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --all-groups
      - run: uv build
      - run: uv run twine check dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7
