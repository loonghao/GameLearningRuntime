name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  godot-provider:
    name: Godot native provider
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: loonghao/vx@61a604b0dc206c691c33db8e8f9c420ca47c3914 # vx-v0.9.30
        with:
          version: "0.9.30"
          github-token: ${{ github.token }}
          tools: "uv just"
          cache: "true"
      - run: vx just setup
      - name: Download and verify the official Godot runtime
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --output "$RUNNER_TEMP/godot.zip" \
            https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          echo "d0bc2113065e481c9c2c2b2c37daa4e8be3fe9e27f0ab9ab0b6096e9a37907f3  $RUNNER_TEMP/godot.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
      - name: Check native reset, action and stale-request behavior
        run: vx uv run --no-sync python scripts/check_godot_provider.py --godot "$RUNNER_TEMP/godot/Godot_v4.6.3-stable_linux.x86_64"

  core:
    # Keep this context stable: main branch protection requires these names.
    name: core / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned vx toolchain
        uses: loonghao/vx@61a604b0dc206c691c33db8e8f9c420ca47c3914 # vx-v0.9.30
        with:
          version: "0.9.30"
          github-token: ${{ github.token }}
          tools: "uv just"
          cache: "true"
      - run: vx just ci-core "${{ matrix.python-version }}"

  torchrl:
    name: TorchRL 0.13 contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned vx toolchain
        uses: loonghao/vx@61a604b0dc206c691c33db8e8f9c420ca47c3914 # vx-v0.9.30
        with:
          version: "0.9.30"
          github-token: ${{ github.token }}
          tools: "uv just"
          cache: "true"
      - run: vx just ci-torchrl

  gymnasium:
    name: Gymnasium 1.x contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned vx toolchain
        uses: loonghao/vx@61a604b0dc206c691c33db8e8f9c420ca47c3914 # vx-v0.9.30
        with:
          version: "0.9.30"
          github-token: ${{ github.token }}
          tools: "uv just"
          cache: "true"
      - run: vx just ci-gymnasium

  runtime-host:
    name: Runtime Host and provider SDKs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned vx toolchain
        uses: loonghao/vx@61a604b0dc206c691c33db8e8f9c420ca47c3914 # vx-v0.9.30
        with:
          version: "0.9.30"
          github-token: ${{ github.token }}
          tools: "uv just rust dotnet"
          cache: "true"
      - name: Install the pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: vx just ci-runtime-host

  package:
    name: Build distribution
    needs: [core, gymnasium, torchrl, runtime-host]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned vx toolchain
        uses: loonghao/vx@61a604b0dc206c691c33db8e8f9c420ca47c3914 # vx-v0.9.30
        with:
          version: "0.9.30"
          github-token: ${{ github.token }}
          tools: "uv just"
          cache: "true"
      - run: vx just ci-package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7
