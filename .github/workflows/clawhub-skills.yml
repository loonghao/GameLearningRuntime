name: Publish GLR skills

on:
  pull_request:
    paths:
      - '.agents/skills/**'
      - 'plugins/**'
      - 'scripts/*skills*'
      - 'scripts/package_agent_plugin.py'
      - 'tests/test_publish_skills.py'
      - 'pyproject.toml'
      - '.github/workflows/clawhub-skills.yml'
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the project version (main or matching release tag only)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: clawhub-skills
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/package_agent_plugin.py --check
      - run: python scripts/publish_skills.py
      - uses: actions/upload-artifact@v4
        with:
          name: clawhub-preview
          path: dist/clawhub-receipts.json

  publish:
    needs: scan
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: clawhub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Publish checksummed versioned skills
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: python scripts/publish_skills.py --publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clawhub-publication-receipts
          path: dist/clawhub-receipts.json
          if-no-files-found: ignore
