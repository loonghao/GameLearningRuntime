name: Publish GLR skills

on:
  pull_request:
    paths:
      - '.agents/skills/**'
      - '.github/workflows/clawhub-skills.yml'
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish after scan (main or release tag only)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    outputs:
      eligible: ${{ steps.guard.outputs.eligible }}
    steps:
      - uses: actions/checkout@v4
      - id: guard
        shell: bash
        run: |
          set -euo pipefail
          ref="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF_TYPE" == tag || "$ref" == main ]]; then
            echo 'eligible=true' >> "$GITHUB_OUTPUT"
          else
            echo 'eligible=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Scan skills (dry run)
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate skill packages
        run: |
          set -euo pipefail
          test -d .agents/skills
          ! grep -RInE '(^|[^A-Za-z])(sk-[A-Za-z0-9_-]+|ghp_[A-Za-z0-9]+|CLAWHUB_TOKEN)' .agents/skills || exit 1
          while IFS= read -r -d '' skill_md; do
            test -s "$skill_md"
            skill_dir="$(dirname "$skill_md")"
            echo "Validating ${skill_dir}"
            npx --yes clawhub@0.23.1 publish "$skill_dir" --dry-run --json >/dev/null
          done < <(find .agents/skills -name SKILL.md -type f -print0)

  publish:
    needs: scan
    if: needs.scan.outputs.eligible == 'true' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    environment: clawhub
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish verified skills
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The publisher reads the token from the environment; shell tracing is disabled.
          test -n "${CLAWHUB_TOKEN:-}"
          while IFS= read -r -d '' skill_md; do
            skill_dir="$(dirname "$skill_md")"
            echo "Publishing ${skill_dir}"
            npx --yes clawhub@0.23.1 publish "$skill_dir" --json
          done < <(find .agents/skills -name SKILL.md -type f -print0)
