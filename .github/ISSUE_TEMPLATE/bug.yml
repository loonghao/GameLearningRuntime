name: Bug report
description: Report a reproducible GLR defect
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include secrets, proprietary game data, or unauthorized instrumentation details.
  - type: input
    id: version
    attributes:
      label: GLR version or commit
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal authorized reproduction
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

