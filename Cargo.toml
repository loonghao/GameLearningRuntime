[workspace]
members = ["crates/glr-host"]
resolver = "3"

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.98"
authors = ["loonghao <hal.long@outlook.com>"]
license = "MIT"
repository = "https://github.com/loonghao/GameLearningRuntime"

[workspace.dependencies]
base64 = "0.22.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
thiserror = "2.0.16"
uuid = { version = "1.18.1", features = ["v4"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
