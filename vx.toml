[project]
name = "game-learning-runtime"
description = "Reproducible local and CI toolchain for Game Learning Runtime"

[tools]
actionlint = "1.7.12"
python = "3.12.13"
uv = "0.12.7"
just = "1.58.0"

[env]
UV_PROJECT_ENVIRONMENT = ".venv-glr"

[scripts]
setup = "vx just setup"
check = "vx just check"
test = "vx just test"
lint = "vx just lint"
typecheck = "vx just typecheck"
workflow-check = "vx just workflow-check"
build = "vx just build"
ci = "vx just ci"

[settings]
auto_install = true
parallel_install = true
